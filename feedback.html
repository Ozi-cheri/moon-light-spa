<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Share your experience at Moon Light Spa. We value your feedback to improve our services.">
    <title>Moon Light Spa</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <header>
      
        <h1 id="logo">Moon Light Spa</h1>
      
      <input type="checkbox" id="nav-toggle" name="nav-toggle">
      <label for="nav-toggle" class="nav-toggle-label">X</label>
      <nav>
        <ul id="menu">
          <li><a href="index.html" class="active">Home</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="prices.html">Prices</a></li>
          <li><a href="contact.html">Contact Us</a></li>
          <li><a href="feedback.html">Feedback</a></li>
        </ul>
      </nav>
    </header>

    <section>
        <h2>We Value Your Feedback</h2>
        <p>Your experience matters to us. Please take a moment to share your thoughts and help us improve our services.</p>
        <form action="thank-you.html" method="get">

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Your Feedback:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Submit Feedback</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 Moon Light Spa. All rights reserved.</p>
    </footer>
</body>

</html>
